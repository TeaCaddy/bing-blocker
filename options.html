<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑名单管理 · Bing 屏蔽助手</title><link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="ui.css"></head>
<body><main><div class="brand"><img src="icons/icon.svg" alt="" width="42" height="42"><div><div class="brand-name">Bing 屏蔽助手</div><div class="brand-note">少一点干扰，多一点有用。</div></div><span class="local-pill">本地保存</span></div><header class="page-heading"><div class="eyebrow">你的搜索，由你做主</div><h1>把干扰留在结果之外。</h1><p class="muted">在这里管理黑名单，让每一次搜索更专注。</p></header><div class="layout"><section class="card"><div class="section-mark" aria-hidden="true">＋</div><h2>添加屏蔽规则</h2><p class="section-note">一个网址，或一整个网站。</p>
<form id="add-form"><label for="input">网址或域名</label><input id="input" required placeholder="例如 https://blog.example.com/article"><label for="scope">屏蔽范围</label><select id="scope"><option value="host">当前子域名（精确匹配）</option><option value="domain">整个网站（包含子域名）</option><option value="page">仅此页面</option></select><p id="preview" class="hint">输入地址后显示实际屏蔽范围。</p><button class="primary" type="submit"><span aria-hidden="true">＋</span> 添加规则</button></form><p id="status" role="status"></p>
<p class="foot">单页规则保留查询参数，忽略 # 后的锚点。域名规则不区分 HTTP 和 HTTPS。</p></section>
<section class="card"><div class="list-heading"><h2>黑名单</h2><span id="count"></span></div><label for="search">搜索规则</label><input type="search" id="search" placeholder="输入域名或网址"><div id="rules"></div><p class="foot">删除规则后，已打开的 Bing 页面会自动恢复不再命中规则的结果。</p></section></div><footer>本地保存 · 无账号 · 不上传搜索记录</footer></main><script src="vendor/tldts.js"></script><script src="core.js"></script><script src="ui.js"></script></body></html>
